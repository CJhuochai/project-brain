<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Project Brain architecture</title><desc id="description">Local-first architecture for a multi-repository code knowledge base.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09182a"/><stop offset="1" stop-color="#101a38"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a78c5"/><stop offset="1" stop-color="#67bfff"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6757d4"/><stop offset="1" stop-color="#af8dff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#188873"/><stop offset="1" stop-color="#62d8b7"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7f9ec0"/></marker><style>text{font-family:Arial,sans-serif}.k{fill:#96b4d7;font-size:13px;letter-spacing:1.6px}.h{fill:#f4f8ff;font-size:22px;font-weight:700}.t{fill:#c8d9ed;font-size:15px}.s{fill:#9bb4d2;font-size:13px}.box{stroke:#496b8c;stroke-width:1.4}.line{stroke:#7f9ec0;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" rx="22" fill="url(#bg)"/><circle cx="1135" cy="35" r="135" fill="#438fd0" opacity=".1"/><circle cx="55" cy="540" r="130" fill="#805de5" opacity=".11"/>
  <text x="56" y="62" class="k">PROJECT BRAIN / LOCAL-FIRST</text><text x="56" y="104" class="h" font-size="31">Multi-repository code knowledge architecture</text><text x="56" y="134" class="t">Source, indexes, reports, and feedback remain on the user's computer</text>
  <rect x="56" y="188" width="205" height="128" rx="16" fill="#112943" class="box"/><circle cx="89" cy="224" r="12" fill="#69bcf8" filter="url(#glow)"/><text x="114" y="230" class="h">Entry points</text><text x="82" y="267" class="t">Agent / command line</text><text x="82" y="292" class="s">Standard tool protocol</text>
  <rect x="322" y="171" width="250" height="162" rx="18" fill="url(#blue)"/><text x="351" y="214" class="k" fill="#e4f5ff">ONE PER WORKSPACE</text><text x="351" y="257" class="h">Local coordinator</text><text x="351" y="288" class="t" fill="#eff9ff">Coalesced refresh · routing</text><text x="351" y="312" class="s" fill="#eff9ff">Loopback · local token</text>
  <rect x="633" y="171" width="244" height="162" rx="18" fill="#112b46" class="box"/><text x="662" y="214" class="k">IMMUTABLE EVIDENCE</text><text x="662" y="257" class="h">Code snapshots</text><text x="662" y="288" class="t">Files · symbols · edges</text><text x="662" y="312" class="s">Every read uses one full version</text>
  <rect x="938" y="171" width="205" height="162" rx="18" fill="#123b39" class="box"/><text x="967" y="214" class="k" fill="#b3ebdc">LOCAL CONTROL</text><text x="967" y="257" class="h">Reports</text><text x="967" y="288" class="t">Feedback · rules</text><text x="967" y="312" class="s">History persists</text><path d="M261 252H312M572 252H623M877 252H928" class="line"/>
  <rect x="130" y="399" width="230" height="109" rx="16" fill="#182543" class="box"/><text x="160" y="439" class="k">READ-ONLY BOUNDARY</text><text x="160" y="473" class="h">Repositories</text><text x="160" y="496" class="s">No fetch · checkout · write</text>
  <rect x="477" y="399" width="246" height="109" rx="16" fill="url(#violet)"/><text x="507" y="439" class="k" fill="#f2eaff">INCREMENTAL REFRESH</text><text x="507" y="473" class="h">Staging snapshot</text><text x="507" y="496" class="s" fill="#f8f2ff">Extract, then atomically activate</text>
  <rect x="840" y="399" width="230" height="109" rx="16" fill="url(#green)"/><text x="870" y="439" class="k" fill="#ddfff4">TRACEABLE OUTPUT</text><text x="870" y="473" class="h">Analysis reports</text><text x="870" y="496" class="s" fill="#effff9">Repositories · evidence · risks</text><path d="M360 453H467M723 453H830M602 333V370H245V389M602 370H955V389" class="line"/>
  <text x="56" y="538" class="s">Privacy boundary: source, indexes, reports, and feedback never leave the local machine.</text>
</svg>
