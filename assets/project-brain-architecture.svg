<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Project Brain local-first architecture</title>
  <desc id="description">Agents and CLI connect through MCP to one local coordinator. It reads immutable snapshots, refreshes indexes from read-only repositories, and persists reports and feedback locally.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08182a"/><stop offset="1" stop-color="#101a37"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2478c9"/><stop offset="1" stop-color="#5fb9f8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6958d9"/><stop offset="1" stop-color="#b18cff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16866f"/><stop offset="1" stop-color="#61d7b5"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7898bd"/></marker>
    <style>text{font-family:Arial,'Microsoft YaHei',sans-serif}.k{fill:#91a9c7;font-size:13px;letter-spacing:1.5px}.h{fill:#f3f8ff;font-size:20px;font-weight:700}.t{fill:#c5d6e9;font-size:14px}.s{fill:#89a4c4;font-size:12px}.box{stroke:#41617f;stroke-width:1.2}.line{stroke:#7898bd;stroke-width:1.7;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="620" rx="22" fill="url(#bg)"/>
  <circle cx="1120" cy="62" r="155" fill="#347fc0" opacity=".12"/><circle cx="76" cy="565" r="170" fill="#885dec" opacity=".10"/>
  <text x="54" y="62" class="k">PROJECT BRAIN / LOCAL-FIRST CODE INTELLIGENCE</text>
  <text x="54" y="101" class="h" font-size="29">多仓库代码知识库 · 一致、可追溯、只在本机运行</text>
  <text x="54" y="130" class="t">Local-first architecture for microservice requirement analysis and change impact discovery</text>

  <rect x="55" y="194" width="194" height="126" rx="15" fill="#10263f" class="box"/>
  <circle cx="86" cy="228" r="12" fill="#68b9f5" filter="url(#glow)"/><text x="110" y="233" class="h">Agent / CLI</text>
  <text x="78" y="266" class="t">Codex · MCP client</text><text x="78" y="291" class="t">Command line · Plugin</text>

  <rect x="304" y="177" width="267" height="160" rx="18" fill="url(#blue)" opacity=".95"/>
  <text x="333" y="225" class="k" fill="#dff3ff">ONE PER WORKSPACE</text>
  <text x="333" y="262" class="h">Local Coordinator</text>
  <text x="333" y="291" class="t" fill="#eff9ff">Loopback + random token</text><text x="333" y="315" class="t" fill="#eff9ff">Refresh coalescing · snapshot routing</text>

  <rect x="632" y="177" width="238" height="160" rx="18" fill="#112b45" class="box"/>
  <text x="662" y="225" class="k">IMMUTABLE EVIDENCE</text>
  <text x="662" y="262" class="h">Index Snapshots</text>
  <text x="662" y="291" class="t">snapshot-001.sqlite</text><text x="662" y="315" class="t">symbols · edges · FTS evidence</text>

  <rect x="925" y="177" width="220" height="160" rx="18" fill="#123a38" class="box"/>
  <text x="954" y="225" class="k" fill="#a8ead9">MUTABLE CONTROL</text>
  <text x="954" y="262" class="h">control.sqlite</text>
  <text x="954" y="291" class="t">active snapshot · reports</text><text x="954" y="315" class="t">feedback · rule revisions</text>

  <path d="M249 257H294" class="line"/><path d="M571 257H622" class="line"/><path d="M870 257H915" class="line"/>
  <text x="259" y="243" class="s">stdio MCP / JSON</text><text x="581" y="243" class="s">read one version</text><text x="878" y="243" class="s">report &amp; feedback</text>

  <rect x="174" y="426" width="250" height="125" rx="16" fill="#172343" class="box"/>
  <text x="204" y="466" class="k">READ-ONLY BUSINESS WORKSPACE</text>
  <text x="204" y="500" class="h">Git repositories</text>
  <text x="204" y="526" class="t">Remote-default baseline · no fetch / checkout</text>

  <rect x="482" y="426" width="236" height="125" rx="16" fill="url(#violet)" opacity=".95"/>
  <text x="512" y="466" class="k" fill="#f2eaff">INCREMENTAL REFRESH</text>
  <text x="512" y="500" class="h">Staging snapshot</text>
  <text x="512" y="526" class="t" fill="#f8f2ff">Extract → checkpoint → atomic activate</text>

  <rect x="776" y="426" width="253" height="125" rx="16" fill="url(#green)" opacity=".95"/>
  <text x="806" y="466" class="k" fill="#dbfff4">TRACEABLE OUTPUT</text>
  <text x="806" y="500" class="h">Analysis report</text>
  <text x="806" y="526" class="t" fill="#effff9">repositories · evidence · impact · risks</text>

  <path d="M424 488H472" class="line"/><path d="M718 488H766" class="line"/>
  <path d="M600 337V390H300V416" class="line"/><path d="M600 390H895V416" class="line"/>
  <text x="560" y="383" class="s">background refresh</text>
  <text x="54" y="592" class="s">Privacy boundary: source code, indexes, reports and feedback remain on the user’s machine.</text>
</svg>
